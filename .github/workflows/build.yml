name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        id: build
        run: gradle build --no-daemon 2>&1 | tee build.log

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "build failed on ${GITHUB_SHA}"
            echo '```'
            grep -v '^\s*$' build.log | tail -150
            echo '```'
          } > report.md
          gh issue create -R "$GITHUB_REPOSITORY" -t "build failed ${GITHUB_SHA:0:7}" -F report.md || true

      - uses: actions/upload-artifact@v4
        with:
          name: AKvisuals
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
